<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <title>Login</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous"
    >
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 520px;">
    <h1 class="mb-4">Login</h1>

    <div id="message" class="alert d-none" role="alert"></div>

    <form id="login-form">
        <div class="mb-3">
            <label class="form-label" for="username">Username</label>
            <input id="username" class="form-control" required />
        </div>

        <div class="mb-3">
            <label class="form-label" for="password">Passwort</label>
            <input id="password" type="password" class="form-control" required />
        </div>

        <button class="btn btn-success w-100" type="submit">Einloggen</button>
    </form>

    <div class="mt-3">
        <a href="register.html">Noch kein Account? Registrieren</a>
    </div>
</div>

<script>
    const API = "/auth/login";

    const msg = document.getElementById("message");
    const form = document.getElementById("login-form");

    function show(type, text) {
        msg.className = "alert alert-" + type;
        msg.textContent = text;
    }
    function clear() {
        msg.className = "alert d-none";
        msg.textContent = "";
    }

    // Falls form nicht gefunden wird, siehst du es direkt:
    if (!form) {
        console.error("login-form nicht gefunden (ID stimmt nicht?)");
    }

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        clear();

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;

        console.log("Submitting login for:", username); // Debug

        try {
            const res = await fetch(API, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password })
            });

            if (!res.ok) {
                const errText = await res.text();
                throw new Error(errText || ("Login fehlgeschlagen (" + res.status + ")"));
            }

            const data = await res.json();
            console.log("LOGIN OK:", data);

            localStorage.setItem("user", JSON.stringify(data));

            show("success", "Login erfolgreich als " + data.role);
            setTimeout(() => window.location.href = "shop.html", 500);

        } catch (err) {
            console.error(err);
            show("danger", err.message);
        }
    });
</script>
</body>
</html>
