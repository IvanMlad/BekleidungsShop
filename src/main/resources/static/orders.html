<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Bestellungen (Mitarbeiter)</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous"
    >
</head>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">

        <!-- LINKS -->
        <span class="navbar-text text-light fw-semibold">
      Mitarbeiterbereich
    </span>

        <!-- MITTE -->
        <span class="navbar-brand mx-auto position-absolute start-50 translate-middle-x">
      Bestellungen
    </span>

        <!-- RECHTS -->
        <div class="d-flex align-items-center">
            <a class="nav-link text-light me-3" href="shop.html">Shop</a>
            <button id="logoutBtn" class="btn btn-outline-light btn-sm">
                Logout
            </button>
        </div>

    </div>
</nav>


<div class="container py-4">
    <h1 class="mb-4">Bestellungen</h1>

    <div id="message" class="alert d-none" role="alert"></div>

    <table class="table table-striped table-bordered align-middle" id="orders-table">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Kunde</th>
            <th>Gesamt</th>
            <th>Positionen</th>
            <th>Aktion</th>
        </tr>
        </thead>
        <tbody></tbody>
    </table>

    <div id="details" class="mt-4 d-none">
        <h2 class="mb-3">Bestellung <span id="details-order-id"></span></h2>

        <table class="table table-bordered align-middle">
            <thead class="table-secondary">
            <tr>
                <th>Produkt</th>
                <th>Preis</th>
                <th>Menge</th>
                <th>Summe</th>
            </tr>
            </thead>
            <tbody id="details-items"></tbody>
        </table>

        <button id="close-details" class="btn btn-secondary">Schließen</button>
    </div>
</div>

<script>
    const user = JSON.parse(localStorage.getItem("user") || "null");
    if (!user || (user.role !== "EMPLOYEE" && user.role !== "ADMIN")) {
        alert("Kein Zugriff. Bitte als Mitarbeiter/Admin einloggen.");
        location.href = "login.html";
    }

    const API_ORDERS = "/orders";

    const messageBox = document.getElementById("message");
    const tbody = document.querySelector("#orders-table tbody");

    const detailsBox = document.getElementById("details");
    const detailsOrderId = document.getElementById("details-order-id");
    const detailsItems = document.getElementById("details-items");
    const closeDetailsBtn = document.getElementById("close-details");

    let orders = [];

    function showMessage(type, text) {
        messageBox.className = "alert alert-" + type;
        messageBox.textContent = text;
    }
    function clearMessage() {
        messageBox.className = "alert d-none";
        messageBox.textContent = "";
    }

    async function loadOrders() {
        try {
            clearMessage();
            const res = await fetch(API_ORDERS);
            if (!res.ok) throw new Error("Fehler beim Laden der Bestellungen (Status " + res.status + ")");
            orders = await res.json();
            renderOrders();
        } catch (e) {
            showMessage("danger", e.message);
        }
    }

    function renderOrders() {
        tbody.innerHTML = "";

        if (!orders || orders.length === 0) {
            tbody.innerHTML = `<tr><td colspan="5">Noch keine Bestellungen vorhanden.</td></tr>`;
            return;
        }

        orders.forEach(o => {
            const tr = document.createElement("tr");
            const itemCount = o.items ? o.items.length : 0;

            tr.innerHTML = `
                <td>${o.id}</td>
                <td>${o.customerName ?? ""}</td>
                <td>${Number(o.totalPrice ?? 0).toFixed(2)} €</td>
                <td>${itemCount}</td>
                <td>
                    <button class="btn btn-sm btn-primary" data-action="details">Details</button>
                </td>
            `;

            tr.querySelector('[data-action="details"]').addEventListener("click", () => showDetails(o));
            tbody.appendChild(tr);
        });
    }

    function showDetails(order) {
        detailsOrderId.textContent = "#" + order.id;
        detailsItems.innerHTML = "";

        (order.items || []).forEach(item => {
            const sum = (item.price * item.quantity);
            const tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${item.name}</td>
                <td>${Number(item.price).toFixed(2)} €</td>
                <td>${item.quantity}</td>
                <td>${sum.toFixed(2)} €</td>
            `;
            detailsItems.appendChild(tr);
        });

        detailsBox.classList.remove("d-none");
        detailsBox.scrollIntoView({behavior: "smooth"});
    }

    closeDetailsBtn.addEventListener("click", () => {
        detailsBox.classList.add("d-none");
    });

    loadOrders();
</script>

<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous">
</script>

<script>
    const user = JSON.parse(localStorage.getItem("user") || "null");
    if (!user) {
        location.href = "login.html";
    }

    document.getElementById("logoutBtn").addEventListener("click", () => {
        localStorage.removeItem("user");
        location.href = "login.html";
    });
</script>
</body>
</html>
