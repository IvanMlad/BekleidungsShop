<!doctype html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registrieren</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
        crossorigin="anonymous"
        >
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 520px;">
    <h1 class="mb-4">Registrieren</h1>

    <div id="message" class="alert d-none" role="alert"></div>

    <form id="register-form">
        <div class="mb-3">
            <label class="form-label">Username</label>
            <input id="username" class="form-control" required />
        </div>

        <div class="mb-3">
            <label class="form-label">Passwort</label>
            <input id="password" type="password" class="form-control" required />
        </div>

        <div class="mb-3">
            <label class="form-label">Rolle</label>
            <select id="role" class="form-select">
                <option value="CUSTOMER" selected>Kunde</option>
                <option value="EMPLOYEE">Mitarbeiter</option>
                <option value="ADMIN">Admin</option>
            </select>
            <div class="form-text">Für die Demo kannst du Rollen auswählen.</div>
        </div>

        <button class="btn btn-primary w-100" type="submit">Account erstellen</button>
    </form>
    <div class="mt-3">
        <a href="login.html">Schon einen Account? Login</a>
    </div>
</div>

<script>
    const API = "/auth/register";

    const msg = document.getElementById("message");
    const form = document.getElementById("register-form");

    function show(type, text) {
        msg.className = "alert alert" + type;
        msg.textContent = "";
    }

    function clear(){
        msg.className = "alert d-none";
        msg.textContent ="";
    }

    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        clear();

        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value;
        const role = document.getElementById("role").value;

        try {
            const res = await fetch(API, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({username, password, role})
            });

            if(!res.ok){
                const text = await res.text();
                throw new Error(text || ("Fehler: " + res.status));
            }
            show("success", "Registrierung erfolgreich!");
            setTimeout (() => location.href = "login.html", 700);
        } catch (err) {
            show("danger", err.message);
        }

    });
</script>
</body>
</html>
